3,4"}, "21": {"text": "CLOVA Studio의 Chat Completion API에서 설정할 수 있는 최대 maxTokens는?", "options": ["1) 4096", "2) 4294", "3) 7234", "4) 9672"], "answer": "1"}, "22": {"text": "임베딩 api 중 clir-sts-dolphin 모델에서 사용하는 거리 계산 알고리즘은?", "options": ["1) Inner Product", "2) IP", "3) Cosine Similarity", "4) Euclidean distance"], "answer": "3"}, "23": {"text": "다음 중 CLOVA Speech Recognition의 인식 가능 시간으로 적합한 것은?", "options": ["1) 60초", "2) 120초", "3) 180초", "4) 240초"], "answer": "1"}, "24": {"text": "다음 중 RNN(Recurrent Neural Network)의 입출력 방식으로 맞는 것을 모두 고르시오.", "options": ["1) One to one", "2) One to many", "3) many to one", "4) many to many"], "answer": "1,2,3,4"}, "25": {"text": "다음 중 클로바 스튜디오의 스킬에서 API Spec 작성 시, API를 호출할 수 있는 도메인을 지정하는 부분은?", "options": ["1) Servers", "2) paths", "3) summary", "4) parameters"], "answer": "1"}, "26": {"text": "다음 중 클로바 스튜디오의 이용 정책과 관련된 지표를 모두 고르시오", "options": ["1) PQM", "2) TQM", "3) TPM", "4) QPM"], "answer": "3,4"}, "27": {"text": "스킬 트레이너를 사용할 때, 구현하는 순서로 맞는 것을 고르시오.  A. 스킬 추가  B. 시나리오 수집,  C. 스킬셋 생성,  D. 스킬셋 튜닝", "options": ["1) C->B->A->D", "2) A->B->C->D", "3) C->A->B->D", "4) A->C->B->D"], "answer": "1"}, "28": {"text": "튜닝 학습 기법 중 유저 지시에 대한 이행 능력을 대폭 끌어올려, 모델을 유저가 원하는 대로 자유롭게 조정할 수 있는 학습 기법은 무엇인가?", "options": ["1) Supervised Finetuning", "2) Parameter Efficient Finetuning", "3) In-Context Learning", "4) Further Pretraining"], "answer": "1"}, "29": {"text": "김초록씨는 Chat Completions API를 활용하여 테스트 중, 어느 순간 데이터를 더이상 생성하지 않는 현상이 발생했다. 이를 해결하기 위한 방법으로 가장 적합한 것은?", "options": ["1) 이전대화 내용을 수동으로 지워낸다", "2) SegCount 값을 -1로 설정한다.", "3) API Key값이 잘못되었는지 확인한다", "4) Sliding window API를 활용하여 최대 토큰 수 이내로 조절하여 대화가 끊기지 않고 진행되도록 설정한다."], "answer": "4"}, "30": {"text": "다음 중 CLOVA Studio의 튜닝 기능에 대한 설명으로 틀린 것을 고르시오.", "options": ["1) 튜닝작업 생성을 위한 학습 생성 API를 제공한다.", "2) 학습 생성 API의 trainepoch의 기본값은 8이다.", "3) 데이터셋 업로드만으로 원하는 형태의 튜닝 진행할 수 있다.", "4) 튜닝 작업 시작/완료 시점에는 메일 등을 통해 알림을 받을 수 있다."], "answer": "2"}, "31": {"text": "다음 중 CLOVA Studio의 서비스 종류의 특징으로 틀린 것을 고르 1,2"}, "41": {"text": "Function calling의 동작 방식에 대해 틀린 것으로 고르시오.", "options": ["1) 사용자 입력을 바탕으로 모델은 어떤 도구를 사용할지 결정한다.", "2) 모델은 전달받은 함수 결과를 바탕으로 자연스러운 형태의 최종 응답을 생성한다.", "3) 모델이 스스로 Too을 만들어서 결과를 호출한다.", "4) 사용자가 입력한 내용은 messages와 tools 정보가 함께 Function calling 모델에 전달된다."], "answer": "3"}, "42": {"text": "다음 중 임베딩 모델이 아닌 것을 고르시오.", "options": ["1) clir-emb-dolphin", "2) bge-m2", "3) clir-sts-dolphin", "4) bge-m3"], "answer": "2"}, "43": {"text": "프롬프트 엔지니어링의 구성 요소를 모두 고르시오", "options": ["1) Instruction", "2) Context", "3) Input data", "4) Output Indicator"], "answer": "1,2,3,4"}, "44": {"text": "네이버가 Al Safety를 위해 대응하고 있는 방식 중 틀린 것을 고르시오.", "options": ["1) 성희롱/비하/차별/욕설 차단할 수 있는 Al Filter를 지원한다.", "2) 할루시네이션을 보완하기 위해 embedding api와 플러그인 기능을 지원한다.", "3) 네이버 AI를 활용하여 개발 및 이용 시 윤리 가이드인 AI 윤리준칙을 준수하도록 한다.", "4) 개인정보 유출 방지 대책, 보안 정책 등을 제공하고 있다."], "answer": "2"}, "45": {"text": "다음 중 HyperCLOVA X언어모델 근간의 서비스가 아닌 것은?", "options": ["1) CUE:", "2) CLOVA X", "3) Cloud connect", "4) CLOVA Studio"], "answer": "3"}, "46": {"text": "언어 모델이 이해할 수 있도록 학습할 텍스트를 의미와 특성에 따라 수치값으로 변환하는 작업을 의미하는 것은 무엇인가?", "options": ["1) Importing", "2) Cleansing", "3) Chunking", "4) Embedding"], "answer": "4"}, "47": {"text": "AI기술 영역 중 인공신경망 기반의 모델로 비정형 데이터로부터 특징 추출 및 판단까지 기계가 한 번에 수행하는 영역은?", "options": ["1) 머신 러닝", "2) 딥러닝", "3) 패턴 분석", "4) 특징 추출"], "answer": "2"}, "48": {"text": "대규모 언어 모델에 대한 사이버 공격의 한 유형으로서, 합법적인 프롬프트로 위장하여 민감한 정보를 빼내는 행동을 의미하는 것은 무엇인가?", "options": ["1) 프롬프트 어택", "2) 프롬프트 인젝션", "3) 프롬프트 해킹", "4) 프롬프트 사이버 어택"], "answer": "2"}, "49": {"text": "김초록씨는 익스플로러의 데이터 확장 기능을 사용하려고 한다. 현재 13개의 행이있는 데이터를 50행까지 확장하고 싶을 경우, 클로바 스튜디오 > 익스플로러의 원하는 데이터 수를 몇으로 지정해야하는가?", "options": ["1) 13", "2) 37", "3) 50", "4) 63"], "answer": "3"}, "50": {"text": "HCX 기반의 네이버가 제공하는 서비스의 종류로 틀린 것을 고르시오.", "options": ["1) CUE", "2) CLOVA Studio", "3) CLOVA X", "4) CLOVA For BLOG"], "answer": "4"}, "51": {"text": "입력과 출력을 시퀀스 단위로 처리하는 시퀀스(Sequence) 모델로서 언어 모델의 근간 기술로 사용되는 것은?", "options": ["1) SHIRDLU", "2) XCALIBU", "3) CNN", "4) RNN"], "answer": "4"}, "52": {"text": "다음 중 Langchain의 구성요소가 아닌 것은?", "options": ["1) Document Loaders", "2) Retrievers", "3) API", "4) Index"], "answer": "3"}, "53": {"text": "CLOVA Studio의 플레이그라운드에서 대시시스템에 대한 지시사항을 놓는 부분은 어디인가?", "options": ["1) 사용자", "2) 제목", "3) 시스템", "4) 어시스턴트"], "answer": "3"}, "54": {"text": "CLOVA Speech에서 인식가능한 파일의 최대 크기는?", "options": ["1) 1GB", "2) 2GB", "3) 3GB", "4) 4GB"], "answer": "2"}, "55": {"text": "다음 중 네이버클라우드플랫폼 CLOVA Speech 서비스의 특징이 아닌 것은?", "options": ["1) 음성 메모, 영상 자막 생성, 통화 녹취록 관리 등의 서비스를 만들 때 활용할 수 있는 음성인식 서비스이다.", "2) 인식 결과 수정을 위한 Speech 빌더를 제공한다.", "3) 프로젝트 단위로 관리된다.", "4) 화자 분리 기능을 제공한다."], "answer": "2"}, "56": {"text": "김초록씨는 클로바 스튜디오를 기반으로 RAG구성을 진행하고자 한다. 이 때 사용자의 질문과 가장 부합하는 몇 개의 후보 청크를 HCX가 참고하여 최종적인 답변을 구성하는 API는?", "options": ["1) Chat Completion API", "2) Chunk API", "3) Final answer API", "4) Chat API"], "answer": "1"}, "57": {"text": "클로바 스튜디오에서 사용자가 최신 정보나 신뢰할 수 있는 정보를 제공할 수 있고, 많은 양의 데이터를 매번 학습하기 어려운 한계를 보완하여 효율적으로 모델의 지식을 업데이트할 수 있도록 도움을 줄 수 있는 기능은?", "options": ["1) 플레이그라운드", "2) 스킬트레이너", "3) 튜닝", "4) 익스플로러"], "answer": "2"}, "58": {"text": "익스플로러에서 제공하는 API 종류를 모두 고르시오.", "options": ["1) 데이터 확장", "2) 문단 나누기", "3) 토큰 제한기", "4) 임베딩"], "answer": "1,2,4"}, "59": {"text": "다음 중 플레이그라운드의 파라미터로 적절하기 않은 것을 고르시오.", "options": ["1) Start sequences", "2) TOP K", "3) TOP P", "4) Repetition penalty"], "answer": "1"}, "60": {"text": "플레이그라운드의 파라미터 중 아래 설명에 맞는 파라미터는? 확률 분포에 가중치 변화를 주어 문장의 다양성을 조절하는 값", "options": ["1) TOP P", "2) TOP K", "3) Repetition Penalty", "4) temperature"], "answer": "4"}, "61": {"text": "스킬 트레이너의 사고과정(CoT)에서 호출해야 할 API Spec을 확인하는 단계는 어느 단계인지 고르시오.", "options": ["1) Step1", "2) Step2", "3) Step3", "4) Step4"], "answer": "2"}, "62": {"text": "다음 중 빈 칸에 알맞은 단어를 고르시오. ()은 인공지능, 특히 언어 모델에게 정확한 정보나 창의적인 콘텐츠를 생성하도록 지시하는 방법을 연구하는 분야를 의미합니다", "options": ["1) RAG", "2) 프롬프트 엔지니어링", "3) 프롬프트", "4) 토크나이징"], "answer": "2"}, "63": {"text": "김초록씨는 자사에서 보유한 데이터셋을 HyperCLOVA와 결합하여 특화 AI 언어 모델을 ["1) Seed", "2) Repetition Penalty", "3) Beam width", "4) TOP P"], "answer": "3"}, "75": {"text": "트랜스포머 아키텍처에 대한 설명으로 틀린 것은?", "options": ["1) Encoder 와 Decoder 로 구성되어 있다.", "2) Multi-headed attention을 도입함으로써 다양한 문장, 복잡한 문장에 대한 처리를 효율적으로 진행할 수 있게 되었다.", "3) 동일한 문장 내 토큰들 간의 유사도를 계산하는 Self-attention 기법을 사용한다.", "4) 입력과 출력을 시퀀스 단위로 처리하는 시퀀스(Sequence) 모델"], "answer": "4"}, "76": {"text": "function calling의 요청 body의 toolCalls 필드에 대한 설명으로 틀린것으로 고르시오", "options": ["1) id : 도구 식별자", "2) function : 호출 function 정보", "3) function.name : function 이름", "4) function.arguments : function 사용시 전달하는 매개변수"], "answer": "4"}, "77": {"text": "RAG Structure의 구성 요소로 맞는 것을 모두 고르시오", "options": ["1) LLM", "2) Embedding Model", "3) Vector Store", "4) Dataset"], "answer": "1,2,3"}, "78": {"text": "프롬프트 엔지니어링의 인컨텍스트 기법에서 아래와 같은 형식은 어떤 기법에 속하는 지 고르시오 시스템 프롬프트 : 마케팅 문구를 작성해줘 - 상품: 커피 - 마케팅 문구: 향기롭고 산미가 가득한 아메리카노", "options": ["1) zero shot", "2) few shot", "3) one shot", "4) CoT"], "answer": "3"}, "79": {"text": "튜닝 방식의 설명 중 틀린 것을 고르시오", "options": ["1) RLHF는 추가 레이블 없이 모델 스스로 지속적인 학습이 가능한 방식", "2) PEFT 방식은 기본 모델이 fade-out 되더라도, 계속 활용 가능하다.", "3) SFT/FP는 전체 파라미터가 업데이트 되기때문에 PEFT 방식보다 학습효과가 크다.", "4) PEFT의 학습데이터는 질문-응답 형식이다."], "answer": "2"}, "80": {"text": "네이버의 Al Safety 가이드의 기준과 설명이 올바르게 짝지어진 것을 모두 고르시오", "options": ["1) 인권침해: 대화 중 LLM 모델이 작성한 문장이 인간의 권리 원칙이나 가치를 침해하는 내용인 경우를 의미한다.", "2) 일관성 결여: 답변 내용이 일관된 주제나 논리적 흐름을 유지하지 못하는 경우를 의미한다.", "3) 탈옥 : 타인의 저작물을 무단으로 복제하는 방법을 안내하거나 타인의 의사 결정에 영향을 줄 수 있는 인위적인 콘텐츠를 생성하는 것을 의미한다.", "4) 편견 및 차별: 특정 인종, 성별, 성적 성향, 종교 등 특정 집단을 비하하거나 편견을 바탕으로 차별하는 내용을 의미한다."], "answer": "1,4"}, "81": {"text": "다음 중, CLOVA Studio 플레이그라운드에서 제공하는 파라미터 값을 모두 고르시오", "options": ["1) Seed", "2) Top K", "3) Tone", "4) Temperature"], "answer": "1,2,4"}, "82": {"text": "다음 중 LoRA 방식에 대한 설명 중 틀린 것은?", "options": ["1) Pretrained Weights 부분이 학습이 되는 파라미터이다.", "2) PEFT의 대표적인 방법론 중 하나이다.", "3) 일부 파라미터만 학습을 하기 때문에 컴퓨팅 리소스와 훈련 비용을 줄일 수 있습니다.", "4) 언어모델을 구성하는 대부분 매개변수(parameter)의 가중치(weight)   const btn = document.getElementById('show-remarks-btn');
  const modal = document.getElementById('modal-overlay');
  const closeBtn = document.getElementById('close-modal');
  const modalBody = document.getElementById('modal-body');

  btn.addEventListener('click', function() {
    const checkboxes = document.querySelectorAll('.remark-check:checked');
    if (checkboxes.length === 0) {
      alert('체크된 REMARK 문제가 없습니다.');
      return;
    }
    
    let htmlContent = '';
    checkboxes.forEach(cb => {
      const qNum = cb.getAttribute('data-qnum');
      const qData = questionData[qNum];
      if(qData) {
        htmlContent += `<div class="collected-q">`;
        htmlContent += `<h3>문제 ${qNum}</h3>`;
        htmlContent += `<div><strong>${qData.text}</strong></div>`;
        htmlContent += `<ul style="list-style:none; padding-left:0; margin-top:10px;">`;
        qData.options.forEach(opt => {
          htmlContent += `<li style="margin-bottom:5px;">${opt}</li>`;
        });
        htmlContent += `</ul>`;
        htmlContent += `<div class="collected-ans">정답: ${qData.answer}</div>`;
        htmlContent += `</div>`;
      }
    });
    
    modalBody.innerHTML = htmlContent;
    modal.style.display = 'flex';
  });

  closeBtn.addEventListener('click', function() {
    modal.style.display = 'none';
  });
  
  window.addEventListener('click', function(event) {
    if (event.target == modal) {
      modal.style.display = 'none';
    }
  });

</script>
